<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON PONG</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    user-select: none;
  }

  .scanlines {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.15) 0px,
      rgba(0,0,0,0.15) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 100;
  }

  .crt-glow {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    box-shadow: inset 0 0 120px rgba(0,0,0,0.6);
    pointer-events: none;
    z-index: 99;
  }

  .game-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    z-index: 10;
  }

  .title {
    font-size: 3rem;
    font-weight: bold;
    color: #fff;
    text-shadow:
      0 0 10px #0ff,
      0 0 20px #0ff,
      0 0 40px #0ff,
      0 0 80px #08f;
    letter-spacing: 0.3em;
    animation: flicker 4s infinite alternate;
  }

  @keyframes flicker {
    0%, 95% { opacity: 1; }
    96% { opacity: 0.7; }
    97% { opacity: 1; }
    98% { opacity: 0.5; }
    100% { opacity: 1; }
  }

  .scoreboard {
    display: flex;
    gap: 60px;
    align-items: center;
  }

  .player-score {
    font-size: 2.5rem;
    font-weight: bold;
    letter-spacing: 0.2em;
  }

  .p1-score {
    color: #ff2d95;
    text-shadow: 0 0 15px #ff2d95, 0 0 30px #ff2d95;
  }

  .vs {
    font-size: 1.5rem;
    color: #fff;
    text-shadow: 0 0 10px #fff, 0 0 20px #0ff;
  }

  .p2-score {
    color: #00f5d4;
    text-shadow: 0 0 15px #00f5d4, 0 0 30px #00f5d4;
  }

  canvas {
    border: 3px solid #0ff;
    box-shadow:
      0 0 15px #0ff,
      0 0 30px #0ff,
      inset 0 0 15px rgba(0,255,255,0.1);
    border-radius: 4px;
    background: #0a0a10;
  }

  .controls-info {
    display: flex;
    gap: 80px;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
  }

  .controls-info .p1-ctrl, .controls-info .p2-ctrl {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .p1-ctrl { color: #ff2d95; text-shadow: 0 0 8px #ff2d95; }
  .p2-ctrl { color: #00f5d4; text-shadow: 0 0 8px #00f5d4; }

  .key {
    display: inline-block;
    padding: 2px 10px;
    border: 1px solid;
    border-radius: 3px;
    font-size: 0.75rem;
  }

  .p1-ctrl .key { border-color: #ff2d95; color: #ff2d95; }
  .p2-ctrl .key { border-color: #00f5d4; color: #00f5d4; }

  .btn-reset {
    background: transparent;
    color: #fff;
    border: 2px solid #0ff;
    padding: 10px 40px;
    font-family: 'Courier New', monospace;
    font-size: 1.1rem;
    letter-spacing: 0.2em;
    cursor: pointer;
    text-shadow: 0 0 10px #0ff;
    box-shadow: 0 0 15px rgba(0,255,255,0.3);
    border-radius: 4px;
    transition: all 0.2s;
  }

  .btn-reset:hover {
    background: rgba(0,255,255,0.1);
    box-shadow: 0 0 25px #0ff, 0 0 50px rgba(0,255,255,0.5);
    transform: scale(1.05);
  }

  .btn-reset:active {
    transform: scale(0.95);
  }

  .message {
    position: absolute;
    font-size: 2rem;
    color: #fff;
    text-shadow: 0 0 20px #0ff;
    letter-spacing: 0.2em;
    display: none;
    z-index: 50;
  }

  .speed-indicator {
    font-size: 0.8rem;
    color: #0ff;
    text-shadow: 0 0 8px #0ff;
    letter-spacing: 0.15em;
  }
</style>
</head>
<body>

<div class="scanlines"></div>
<div class="crt-glow"></div>

<div class="game-container">
  <div class="title">NEON PONG</div>

  <div class="scoreboard">
    <div class="player-score p1-score" id="scoreP1">0</div>
    <div class="vs">VS</div>
    <div class="player-score p2-score" id="scoreP2">0</div>
  </div>

  <div style="position: relative;">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    <div class="message" id="message">P1 WINS!</div>
  </div>

  <div class="speed-indicator" id="speedIndicator">SPEED: 1.0x</div>

  <div class="controls-info">
    <div class="p1-ctrl">
      <span>JUGADOR 1</span>
      <span><span class="key">W</span> Arriba &nbsp; <span class="key">S</span> Abajo</span>
    </div>
    <div class="p2-ctrl">
      <span>JUGADOR 2</span>
      <span><span class="key">↑</span> Arriba &nbsp; <span class="key">↓</span> Abajo</span>
    </div>
  </div>

  <button class="btn-reset" id="btnReset">REINICIAR</button>
</div>

<script>
(function() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreP1El = document.getElementById('scoreP1');
  const scoreP2El = document.getElementById('scoreP2');
  const btnReset = document.getElementById('btnReset');
  const messageEl = document.getElementById('message');
  const speedIndicator = document.getElementById('speedIndicator');

  const W = canvas.width;
  const H = canvas.height;
  const PADDLE_W = 14;
  const PADDLE_H = 80;
  const BALL_R = 8;
  const WIN_SCORE = 7;
  const PADDLE_SPEED = 7;
  const BALL_BASE_SPEED = 5;
  const SPEED_INCREMENT = 0.4;
  const MAX_SPEED = 12;
  const NET_COLOR = 'rgba(0, 255, 255, 0.15)';

  let p1Y = H / 2 - PADDLE_H / 2;
  let p2Y = H / 2 - PADDLE_H / 2;
  let ballX = W / 2;
  let ballY = H / 2;
  let ballDX = BALL_BASE_SPEED * (Math.random() > 0.5 ? 1 : -1);
  let ballDY = BALL_BASE_SPEED * (Math.random() > 0.5 ? 1 : -1);
  let speedMultiplier = 1;
  let score1 = 0;
  let score2 = 0;
  let gameOver = false;
  let keys = {};

  function drawPaddle(x, y, color, glowColor) {
    ctx.save();
    ctx.shadowBlur = 20;
    ctx.shadowColor = glowColor;
    ctx.fillStyle = color;
    ctx.fillRect(x, y, PADDLE_W, PADDLE_H);
    ctx.restore();
  }

  function drawBall(x, y, r) {
    ctx.save();
    ctx.shadowBlur = 25;
    ctx.shadowColor = '#fff';
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawNet() {
    ctx.save();
    ctx.setLineDash([10, 10]);
    ctx.strokeStyle = NET_COLOR;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Background grid (subtle)
    ctx.save();
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    for (let y = 0; y < H; y += 40) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    ctx.restore();

    drawNet();

    // Paddles
    drawPaddle(20, p1Y, '#ff2d95', '#ff2d95');
    drawPaddle(W - 20 - PADDLE_W, p2Y, '#00f5d4', '#00f5d4');

    // Ball
    drawBall(ballX, ballY, BALL_R);
  }

  function update() {
    if (gameOver) return;

    // Move paddles
    if (keys['w'] || keys['W']) p1Y = Math.max(0, p1Y - PADDLE_SPEED);
    if (keys['s'] || keys['S']) p1Y = Math.min(H - PADDLE_H, p1Y + PADDLE_SPEED);
    if (keys['ArrowUp']) p2Y = Math.max(0, p2Y - PADDLE_SPEED);
    if (keys['ArrowDown']) p2Y = Math.min(H - PADDLE_H, p2Y + PADDLE_SPEED);

    // Ball movement
    const speed = BALL_BASE_SPEED * speedMultiplier;
    ballX += ballDX * (speed / BALL_BASE_SPEED);
    ballY += ballDY * (speed / BALL_BASE_SPEED);

    // Wall collisions (top/bottom)
    if (ballY - BALL_R <= 0) {
      ballY = BALL_R;
      ballDY = Math.abs(ballDY);
    }
    if (ballY + BALL_R >= H) {
      ballY = H - BALL_R;
      ballDY = -Math.abs(ballDY);
    }

    // Paddle collision - P1 (left)
    const p1Rect = { x: 20, y: p1Y, w: PADDLE_W, h: PADDLE_H };
    if (ballX - BALL_R < p1Rect.x + p1Rect.w &&
        ballX + BALL_R > p1Rect.x &&
        ballY > p1Rect.y &&
        ballY < p1Rect.y + p1Rect.h &&
        ballDX < 0) {
      ballX = p1Rect.x + p1Rect.w + BALL_R;
      // Angle based on hit position
      const hitPos = (ballY - p1Rect.y) / p1Rect.h - 0.5;
      ballDX = Math.abs(ballDX);
      ballDY = hitPos * 6 * speedMultiplier;
      speedMultiplier = Math.min(speedMultiplier + SPEED_INCREMENT, MAX_SPEED / BALL_BASE_SPEED);
    }

    // Paddle collision - P2 (right)
    const p2Rect = { x: W - 20 - PADDLE_W, y: p2Y, w: PADDLE_W, h: PADDLE_H };
    if (ballX + BALL_R > p2Rect.x &&
        ballX - BALL_R < p2Rect.x + p2Rect.w &&
        ballY > p2Rect.y &&
        ballY < p2Rect.y + p2Rect.h &&
        ballDX > 0) {
      ballX = p2Rect.x - BALL_R;
      const hitPos = (ballY - p2Rect.y) / p2Rect.h - 0.5;
      ballDX = -Math.abs(ballDX);
      ballDY = hitPos * 6 * speedMultiplier;
      speedMultiplier = Math.min(speedMultiplier + SPEED_INCREMENT, MAX_SPEED / BALL_BASE_SPEED);
    }

    // Score
    if (ballX < 0) {
      score2++;
      updateScoreboard();
      resetBall(1);
      checkWin();
    }
    if (ballX > W) {
      score1++;
      updateScoreboard();
      resetBall(-1);
      checkWin();
    }

    // Speed indicator
    const speedDisplay = speedMultiplier.toFixed(1);
    speedIndicator.textContent = 'SPEED: ' + speedDisplay + 'x';
  }

  function resetBall(direction) {
    ballX = W / 2;
    ballY = H / 2;
    speedMultiplier = 1;
    ballDX = BALL_BASE_SPEED * direction * (Math.random() > 0.3 ? 1 : -1);
    ballDY = BALL_BASE_SPEED * (Math.random() > 0.5 ? 1 : -1);
  }

  function updateScoreboard() {
    scoreP1El.textContent = score1;
    scoreP2El.textContent = score2;
  }

  function checkWin() {
    if (score1 >= WIN_SCORE) {
      endGame('P1 WINS!');
    } else if (score2 >= WIN_SCORE) {
      endGame('P2 WINS!');
    }
  }

  function endGame(text) {
    gameOver = true;
    messageEl.textContent = text;
    messageEl.style.display = 'block';
    messageEl.style.color = text.includes('P1') ? '#ff2d95' : '#00f5d4';
    messageEl.style.textShadow = text.includes('P1')
      ? '0 0 20px #ff2d95, 0 0 40px #ff2d95'
      : '0 0 20px #00f5d4, 0 0 40px #00f5d4';
  }

  function resetGame() {
    score1 = 0;
    score2 = 0;
    p1Y = H / 2 - PADDLE_H / 2;
    p2Y = H / 2 - PADDLE_H / 2;
    speedMultiplier = 1;
    gameOver = false;
    messageEl.style.display = 'none';
    updateScoreboard();
    resetBall(Math.random() > 0.5 ? 1 : -1);
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  // Input
  window.addEventListener('keydown', function(e) {
    keys[e.key] = true;
    // Prevent scrolling with arrows
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') e.preventDefault();
  });

  window.addEventListener('keyup', function(e) {
    keys[e.key] = false;
  });

  btnReset.addEventListener('click', function() {
    resetGame();
  });

  // Start
  resetGame();
  gameLoop();
})();
</script>
</body>
</html>
